<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generatore di Tono</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --accent: #6366f1;
      --accent-hover: #818cf8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e;
    --card: #2c2c2e;
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --accent: #6366f1;
    --accent-hover: #818cf8;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 36px 28px;
    width: 100%;
    max-width: 820px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  .tones-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .tone-block {
    flex: 1 1 320px;
    border: 1px solid rgba(128,128,128,0.2);
    border-radius: 14px;
    padding: 20px 18px;
    margin-bottom: 20px;
    min-width: 280px;
  }
  .freq-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .freq-input-row input[type="number"] {
    width: 90px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #d1d1d6;
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }
  .freq-input-row span {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .tone-title {
    font-size: 1rem;
    margin: 0 0 12px;
    color: var(--text);
  }
  #stopAllBtn {
    background: #6b7280;
    color: white;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 6px;
    text-align: center;
  }
  p.sub {
    color: var(--muted);
    text-align: center;
    margin: 0 0 28px;
    font-size: 0.9rem;
  }
  .control {
    margin-bottom: 20px;
  }
  label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #d1d1d6;
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }
  button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #playBtn {
    background: var(--accent);
    color: white;
  }
  #playBtn:hover { background: var(--accent-hover); }
  #playBtn:active { transform: scale(0.97); }
  #playBtn.playing {
    background: #dc2626;
  }
  #stopBtn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--muted);
  }
  .freq-display {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 700;
    margin: 10px 0 24px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔊 Generatore di Tono</h1>
    <p class="sub">Genera due toni audio puri contemporaneamente</p>

    <div class="tones-row">
    <div class="tone-block">
      <h2 class="tone-title">Tono 1</h2>
      <div class="freq-display" id="freqDisplay-1">440 Hz</div>

      <div class="control">
        <label>
          <span>Frequenza</span>
          <span id="freqLabel-1">440 Hz</span>
        </label>
        <input type="range" id="freqSlider-1" min="20" max="5000" value="440" step="1">
        <div class="freq-input-row">
          <input type="number" id="freqInput-1" min="20" max="5000" value="440" step="1">
          <span>Hz (20–5000)</span>
        </div>
      </div>

      <div class="control">
        <label>
          <span>Volume</span>
          <span id="volLabel-1">50%</span>
        </label>
        <input type="range" id="volSlider-1" min="0" max="100" value="50" step="1">
      </div>

      <div class="control">
        <label><span>Forma d'onda</span></label>
        <select id="waveSelect-1">
          <option value="sine">Sinusoidale</option>
          <option value="square">Quadra</option>
          <option value="sawtooth">Dente di sega</option>
          <option value="triangle">Triangolare</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="playBtn" id="playBtn-1" data-id="1">▶ Riproduci</button>
        <button class="stopBtn" id="stopBtn-1" data-id="1">Stop</button>
      </div>
    </div>

    <div class="tone-block">
      <h2 class="tone-title">Tono 2</h2>
      <div class="freq-display" id="freqDisplay-2">660 Hz</div>

      <div class="control">
        <label>
          <span>Frequenza</span>
          <span id="freqLabel-2">660 Hz</span>
        </label>
        <input type="range" id="freqSlider-2" min="20" max="5000" value="660" step="1">
        <div class="freq-input-row">
          <input type="number" id="freqInput-2" min="20" max="5000" value="660" step="1">
          <span>Hz (20–5000)</span>
        </div>
      </div>

      <div class="control">
        <label>
          <span>Volume</span>
          <span id="volLabel-2">50%</span>
        </label>
        <input type="range" id="volSlider-2" min="0" max="100" value="50" step="1">
      </div>

      <div class="control">
        <label><span>Forma d'onda</span></label>
        <select id="waveSelect-2">
          <option value="sine">Sinusoidale</option>
          <option value="square">Quadra</option>
          <option value="sawtooth">Dente di sega</option>
          <option value="triangle">Triangolare</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="playBtn" id="playBtn-2" data-id="2">▶ Riproduci</button>
        <button class="stopBtn" id="stopBtn-2" data-id="2">Stop</button>
      </div>
    </div>
    </div>

    <div class="btn-row">
      <button id="stopAllBtn">⏹ Ferma entrambi</button>
    </div>
  </div>

<script>
  // Un unico AudioContext condiviso, ma oscillatori/gain indipendenti per ciascun tono
  let sharedAudioCtx = null;
  function getAudioCtx() {
    if (!sharedAudioCtx) {
      sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (sharedAudioCtx.state === 'suspended') {
      sharedAudioCtx.resume();
    }
    return sharedAudioCtx;
  }

  const voices = {};

  function setupVoice(id) {
    const freqSlider = document.getElementById('freqSlider-' + id);
    const freqInput = document.getElementById('freqInput-' + id);
    const volSlider = document.getElementById('volSlider-' + id);
    const waveSelect = document.getElementById('waveSelect-' + id);
    const freqLabel = document.getElementById('freqLabel-' + id);
    const volLabel = document.getElementById('volLabel-' + id);
    const freqDisplay = document.getElementById('freqDisplay-' + id);
    const playBtn = document.getElementById('playBtn-' + id);
    const stopBtn = document.getElementById('stopBtn-' + id);

    voices[id] = {
      oscillator: null,
      gainNode: null,
      isPlaying: false
    };

    function updateFreqDisplay() {
      const f = freqSlider.value;
      freqLabel.textContent = f + ' Hz';
      freqDisplay.textContent = f + ' Hz';
    }
    function updateVolDisplay() {
      volLabel.textContent = volSlider.value + '%';
    }
    updateFreqDisplay();
    updateVolDisplay();

    function applyFrequency(freq) {
      const v = voices[id];
      if (v.isPlaying && v.oscillator) {
        v.oscillator.frequency.setValueAtTime(freq, getAudioCtx().currentTime);
      }
    }

    function setFrequency(freq, { fromInput } = {}) {
      const min = parseFloat(freqSlider.min);
      const max = parseFloat(freqSlider.max);
      if (isNaN(freq)) return;
      freq = Math.min(max, Math.max(min, freq));
      freqSlider.value = freq;
      if (!fromInput) {
        freqInput.value = freq;
      }
      updateFreqDisplay();
      applyFrequency(freq);
    }

    function startTone() {
      const v = voices[id];
      if (v.isPlaying) return;
      try {
        const ctx = getAudioCtx();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();

        oscillator.type = waveSelect.value;
        oscillator.frequency.setValueAtTime(parseFloat(freqSlider.value), ctx.currentTime);
        gainNode.gain.setValueAtTime(volSlider.value / 100 * 0.3, ctx.currentTime);

        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);
        oscillator.start();

        v.oscillator = oscillator;
        v.gainNode = gainNode;
        v.isPlaying = true;
        playBtn.textContent = '⏸ In riproduzione';
        playBtn.classList.add('playing');
      } catch (e) {
        alert('Impossibile avviare l\'audio: ' + e.message);
      }
    }

    function stopTone() {
      const v = voices[id];
      if (!v.isPlaying) return;
      try {
        v.oscillator.stop();
        v.oscillator.disconnect();
        v.gainNode.disconnect();
      } catch (e) {}
      v.oscillator = null;
      v.gainNode = null;
      v.isPlaying = false;
      playBtn.textContent = '▶ Riproduci';
      playBtn.classList.remove('playing');
    }

    playBtn.addEventListener('click', () => {
      if (voices[id].isPlaying) {
        stopTone();
      } else {
        startTone();
      }
    });

    stopBtn.addEventListener('click', stopTone);

    freqSlider.addEventListener('input', () => {
      setFrequency(parseFloat(freqSlider.value));
    });

    freqInput.addEventListener('input', () => {
      setFrequency(parseFloat(freqInput.value), { fromInput: true });
    });

    freqInput.addEventListener('blur', () => {
      // Alla perdita del focus, riallinea il campo al valore effettivo (clampato)
      freqInput.value = freqSlider.value;
    });

    freqInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        freqInput.blur();
      }
    });

    volSlider.addEventListener('input', () => {
      updateVolDisplay();
      const v = voices[id];
      if (v.isPlaying && v.gainNode) {
        v.gainNode.gain.setValueAtTime(volSlider.value / 100 * 0.3, getAudioCtx().currentTime);
      }
    });

    waveSelect.addEventListener('change', () => {
      const v = voices[id];
      if (v.isPlaying && v.oscillator) {
        v.oscillator.type = waveSelect.value;
      }
    });

    voices[id].stopTone = stopTone;
  }

  setupVoice('1');
  setupVoice('2');

  document.getElementById('stopAllBtn').addEventListener('click', () => {
    Object.values(voices).forEach(v => v.stopTone && v.stopTone());
  });
</script>
</body>
</html>
